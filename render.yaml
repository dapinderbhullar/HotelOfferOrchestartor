services:
  - type: web
    name: hotel-offer-api
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 85
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false
      - key: TEMPORAL_TASK_QUEUE
        value: hotel-offers
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hotel-offer-cache
          property: connectionString
      - key: SUPPLIER_PRIVATE_ADDRESS
        fromService:
          type: pserv
          name: hotel-offer-suppliers
          property: hostport

  - type: worker
    name: hotel-offer-worker
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/temporal/worker.js
    maxShutdownDelaySeconds: 20
    envVars:
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false
      - key: TEMPORAL_TASK_QUEUE
        value: hotel-offers
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hotel-offer-cache
          property: connectionString
      - key: SUPPLIER_PRIVATE_ADDRESS
        fromService:
          type: pserv
          name: hotel-offer-suppliers
          property: hostport

  - type: pserv
    name: hotel-offer-suppliers
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/supplier-server.js
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"

  - type: keyvalue
    name: hotel-offer-cache
    region: oregon
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
