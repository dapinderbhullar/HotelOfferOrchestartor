server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the API again after Compose replaces or restarts its container.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend api:3000;
    location ~ ^/gateway(?<api_path>/api/hotels(?:/refresh)?|/health)$ {
        proxy_pass http://$backend$api_path$is_args$args;
        proxy_set_header Host $http_host;
        proxy_read_timeout 85s;
    }

    location /gateway/ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control no-cache;
        try_files $uri /index.html;
    }
}
